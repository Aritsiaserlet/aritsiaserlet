<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoverTian | AritsiaZ Web</title>
  <link rel="icon" type="image/jpeg" href="favicon-small.jpg">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #0f172a;
      --surface-dark: #1e293b;
      --greybox-bg: #334155;
      --greybox-border: #64748b;
      --greybox-accent: #94a3b8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #e8c87a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-dark);
      border: 2px solid var(--greybox-border);
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 28px;
      color: var(--accent-gold);
    }

    h1.title {
      font-family: 'VT323', monospace;
      font-size: 32px;
      letter-spacing: 2px;
      color: var(--accent-gold);
      margin: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--greybox-bg);
      color: var(--text-main);
      text-decoration: none;
      font-family: 'VT323', monospace;
      font-size: 20px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 2px solid var(--greybox-border);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: var(--accent-gold);
      color: #0f172a;
      border-color: var(--accent-gold);
      transform: translateY(-2px);
    }

    /* Greybox Placeholder Area */
    .greybox-card {
      background: var(--surface-dark);
      border: 2px dashed var(--greybox-border);
      border-radius: 16px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      min-height: 420px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
    }

    .greybox-watermark {
      position: absolute;
      top: 16px;
      left: 20px;
      font-family: 'VT323', monospace;
      font-size: 16px;
      color: var(--text-muted);
      opacity: 0.6;
      letter-spacing: 1px;
    }

    .greybox-content {
      width: 100%;
      max-width: 600px;
      background: var(--greybox-bg);
      border: 2px solid var(--greybox-border);
      border-radius: 12px;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
    }

    .greybox-icon-wrap {
      width: 72px;
      height: 72px;
      background: rgba(148, 163, 184, 0.15);
      border: 2px dashed var(--greybox-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .greybox-icon-wrap span {
      font-size: 36px;
      color: var(--greybox-accent);
    }

    .greybox-title {
      font-family: 'VT323', monospace;
      font-size: 28px;
      color: var(--accent-gold);
    }

    .greybox-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 440px;
      line-height: 1.5;
    }

    /* Skeleton Grey Wireframe Boxes */
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }

    .skeleton-box {
      height: 80px;
      background: rgba(148, 163, 184, 0.1);
      border: 1px dashed var(--greybox-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'VT323', monospace;
      font-size: 16px;
      color: var(--greybox-accent);
    }

    footer {
      text-align: center;
      font-family: 'VT323', monospace;
      font-size: 18px;
      color: var(--text-muted);
      margin-top: auto;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-group">
        <span class="material-symbols-outlined brand-icon">favorite</span>
        <h1 class="title">LOVER TIAN</h1>
      </div>
      <a href="index.html" class="back-btn">
        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
        Portfolio
      </a>
    </header>

    <main>
      <div class="greybox-card">
        <div class="greybox-watermark">[ GREYBOX MODE — RAKTIANNA ]</div>

        <div class="greybox-content">
          <div class="greybox-icon-wrap">
            <span class="material-symbols-outlined">widgets</span>
          </div>

          <h2 class="greybox-title">LoverTian Page Placeholder</h2>
          <p class="greybox-subtitle">
            Welcome to LoverTian! Access granted via secret code <strong>RakTianNa</strong>.
            This module is currently in greybox placeholder mode.
          </p>

          <div class="skeleton-grid">
            <div class="skeleton-box">GREYBOX #1</div>
            <div class="skeleton-box">GREYBOX #2</div>
            <div class="skeleton-box">GREYBOX #3</div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      &copy; 2026 AritsiaZ Web — LoverTian Module
    </footer>
  </div>
</body>
</html>
